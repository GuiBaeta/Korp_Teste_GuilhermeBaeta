services:
  inventory-db:
    image: postgres:17
    container_name: korp-inventory-db
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER} -d ${INVENTORY_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing-db:
    image: postgres:17
    container_name: korp-billing-db
    environment:
      POSTGRES_DB: ${BILLING_DB_NAME}
      POSTGRES_USER: ${BILLING_DB_USER}
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - billing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BILLING_DB_USER} -d ${BILLING_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-api:
    build:
      context: ./backend/Inventory.Api
    container_name: korp-inventory-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__InventoryDatabase: Host=inventory-db;Port=5432;Database=${INVENTORY_DB_NAME};Username=${INVENTORY_DB_USER};Password=${INVENTORY_DB_PASSWORD}
    ports:
      - "5173:8080"
    depends_on:
      inventory-db:
        condition: service_healthy

  billing-api:
    build:
      context: ./backend/Billing.Api
    container_name: korp-billing-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BillingDatabase: Host=billing-db;Port=5432;Database=${BILLING_DB_NAME};Username=${BILLING_DB_USER};Password=${BILLING_DB_PASSWORD}
      Services__InventoryApi: http://inventory-api:8080/
    ports:
      - "5007:8080"
    depends_on:
      billing-db:
        condition: service_healthy
      inventory-api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: korp-frontend
    ports:
      - "4200:80"
    depends_on:
      inventory-api:
        condition: service_started
      billing-api:
        condition: service_started

volumes:
  inventory_data:
  billing_data:
