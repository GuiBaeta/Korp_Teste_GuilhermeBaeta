<div class="app-shell">
  <header class="app-header">
    <mat-toolbar class="app-toolbar">
      <a class="brand" routerLink="/products" aria-label="Ir para produtos">
        <span class="brand-mark" aria-hidden="true">NF</span>
        <span class="brand-text">
          <strong>Emissão NF</strong>
          <small>Sistema de Emissão de Notas Fiscais</small>
        </span>
      </a>

      <nav class="main-navigation" aria-label="Navegação principal">
        <a
          mat-button
          routerLink="/products"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }">
          Produtos
        </a>
        <a
          mat-button
          routerLink="/invoices"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }">
          Notas Fiscais
        </a>
      </nav>
    </mat-toolbar>
  </header>

  <main class="app-content">
    <router-outlet />
  </main>

  <footer class="app-footer">
    Sistema de Emissão de Notas Fiscais
    <span aria-hidden="true">•</span>
    Desenvolvido por Guilherme Baeta
  </footer>
</div>
